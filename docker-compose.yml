services:
  postgres:
    image: postgres:17

    container_name: ccgeek-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ccgeek
      POSTGRES_PASSWORD: ccgeek
      POSTGRES_DB: ccgeek

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: ccgeek-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
volumes:
  postgres_data:
